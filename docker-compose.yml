version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: hostal_mysql_container
    restart: always
    environment:
      MYSQL_DATABASE: hostal_db
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_USER: montsec_user
      MYSQL_PASSWORD: montsec_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: