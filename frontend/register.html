<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostal Montsec | Registre</title>
    
    <!-- Dependencias externas -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Estilos propios -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="page-auth">

    <!-- NAVEGACIÓN -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container justify-content-center">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-tree"></i> Hostal Montsec
            </a>
        </div>
    </nav>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="auth-container">
        <section class="card shadow-sm p-4 auth-card" aria-labelledby="registerTitle">
            <h1 id="registerTitle" class="text-center h3 mb-4 fw-bold">
                Crea el teu compte
            </h1>
            
            <!-- ALERTAS DINÁMICAS (Controladas por app.js) -->
            <div id="registerSuccess" class="alert alert-success d-none text-center" role="alert" aria-live="polite">
                <i class="bi bi-check-circle me-1"></i> Compte creat amb èxit! Redirigint...
            </div>
            
            <div id="registerError" class="alert alert-danger d-none text-center" role="alert" aria-live="assertive">
                <i class="bi bi-exclamation-triangle me-1"></i> 
                <span>Error al crear el compte. Revisa les dades.</span>
            </div>

            <!-- FORMULARIO DE REGISTRO -->
            <form id="registerForm" novalidate>
                <!-- Sección 1: Datos Personales -->
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="regName" class="form-label">Nom</label>
                        <input type="text" 
                               class="form-control" 
                               id="regName" 
                               name="name"
                               autocomplete="given-name"
                               required 
                               minlength="2">
                    </div>
                    <div class="col-md-6">
                        <label for="regSurname" class="form-label">Cognoms</label>
                        <input type="text" 
                               class="form-control" 
                               id="regSurname" 
                               name="surname"
                               autocomplete="family-name"
                               required 
                               minlength="2">
                    </div>
                </div>

                <!-- Sección 2: Identificación y Contacto -->
                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label for="regDni" class="form-label">DNI / NIE</label>
                        <input type="text" 
                               class="form-control text-uppercase" 
                               id="regDni" 
                               name="dni"
                               placeholder="12345678X"
                               required 
                               minlength="9" 
                               maxlength="9" 
                               pattern="^[0-9]{8}[A-Za-z]$|^[XYZxyz][0-9]{7}[A-Za-z]$"
                               title="Format vàlid: 8 números i 1 lletra (o NIE amb X/Y/Z)">
                    </div>
                    <div class="col-md-4">
                        <label for="regPhone" class="form-label">Telèfon</label>
                        <input type="tel" 
                               class="form-control" 
                               id="regPhone" 
                               name="phone"
                               placeholder="600000000"
                               inputmode="numeric"
                               autocomplete="tel"
                               required 
                               pattern="[0-9]{9}" 
                               title="Ha de contenir exactament 9 números">
                    </div>
                    <div class="col-md-4">
                        <label for="regCity" class="form-label">Població</label>
                        <input type="text" 
                               class="form-control" 
                               id="regCity" 
                               name="city"
                               autocomplete="address-level2"
                               required>
                    </div>
                </div>

                <hr class="my-4">

                <!-- Sección 3: Credenciales -->
                <div class="mb-3">
                    <label for="regEmail" class="form-label">Correu electrònic</label>
                    <input type="email" 
                           class="form-control" 
                           id="regEmail" 
                           name="email"
                           autocomplete="email"
                           required 
                           placeholder="nom@exemple.com">
                </div>
                <div class="mb-4">
                    <label for="regPassword" class="form-label">Contrasenya</label>
                    <input type="password" 
                           class="form-control" 
                           id="regPassword" 
                           name="password"
                           autocomplete="new-password"
                           required 
                           minlength="6" 
                           placeholder="Mínim 6 caràcters">
                </div>
                
                <!-- Botón de envío con estado de carga preparado -->
                <button type="submit" class="btn btn-success w-100 mb-3" id="regSubmitBtn">
                    <span id="regBtnText">Registrar-se</span>
                    <span id="regBtnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                </button>
            </form>
            
            <!-- Pie de tarjeta / Navegación secundaria -->
            <div class="text-center mt-2">
                <p class="mb-0">
                    Ja tens un compte? 
                    <a href="login.html" class="text-success text-decoration-none fw-bold">Inicia sessió</a>
                </p>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
