<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostal Montsec | Iniciar Sessió</title>
    
    <!-- External Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="page-auth">

    <!-- NAVIGATION -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container justify-content-center">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-tree"></i> Hostal Montsec
            </a>
        </div>
    </nav>

    <!-- MAIN CONTAINER -->
    <main class="auth-container">
        <section class="card shadow-sm p-4 auth-card" aria-labelledby="loginTitle">
            <h1 id="loginTitle" class="text-center h3 mb-4 fw-bold">
                Iniciar Sessió
            </h1>
            
            <!-- DYNAMIC ALERT (Controlled by app.js) -->
            <div id="loginError" class="alert alert-danger d-none text-center" role="alert" aria-live="assertive">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> 
                <span>Correu o contrasenya incorrectes.</span>
            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label">Correu electrònic</label>
                    <input type="email" 
                           id="email" 
                           name="email"
                           class="form-control" 
                           placeholder="nom@exemple.com"
                           autocomplete="email"
                           required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Contrasenya</label>
                    <input type="password" 
                           id="password" 
                           name="password"
                           class="form-control" 
                           placeholder="La teva contrasenya"
                           autocomplete="current-password"
                           required>
                </div>
                
                <button type="submit" class="btn btn-success w-100 mb-3" id="loginSubmitBtn">
                    Entrar
                </button>
            </form>
            
            <!-- SECONDARY NAVIGATION -->
            <div class="text-center mt-2">
                <p class="mb-0">
                    No tens compte? 
                    <a href="registro.html" class="text-success text-decoration-none fw-bold">Registra't aquí</a>
                </p>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
