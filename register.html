<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostal Montsec | Registre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .register-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            border: none;
            border-top: 4px solid #198754;
        }
    </style>
</head>
<body>

    <!-- Navbar simplificado -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container justify-content-center">
            <a class="navbar-brand" href="index.html"><i class="bi bi-tree"></i> Hostal Montsec</a>
        </div>
    </nav>

    <div class="register-container">
        <div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">
            <h3 class="text-center mb-4">Crea el teu compte</h3>
            
            <div id="registerSuccess" class="alert alert-success d-none text-center">
                <i class="bi bi-check-circle"></i> Compte creat amb èxit! Redirigint...
            </div>
            
            <div id="registerError" class="alert alert-danger d-none text-center">
                <i class="bi bi-exclamation-triangle"></i> Error al crear el compte. Comprova les dades.
            </div>

            <form id="registerForm">
                <div class="mb-3">
                    <label for="regEmail" class="form-label">Correu electrònic</label>
                    <input type="email" class="form-control" id="regEmail" required placeholder="nom@exemple.com">
                </div>
                <div class="mb-4">
                    <label for="regPassword" class="form-label">Contrasenya</label>
                    <input type="password" class="form-control" id="regPassword" required placeholder="Crea una contrasenya">
                </div>
                <button type="submit" class="btn btn-success w-100 mb-3">Registrar-se</button>
            </form>
            
            <div class="text-center mt-2">
                <p class="mb-0">Ja tens un compte? <a href="login.html" class="text-success text-decoration-none fw-bold">Inicia sessió</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
