<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostal Montsec | Panell d'Administració</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; }
        .admin-header {
            background: #212529;
            color: white;
            padding: 2rem 0;
            margin-bottom: 2rem;
            border-bottom: 5px solid #dc3545; /* Línea roja para destacar que es zona admin */
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-shield-lock"></i> Hostal Montsec - ADMIN</a>
            <div class="d-flex">
                <a href="index.html" class="btn btn-outline-light me-2">Veure Web</a>
                <button class="btn btn-danger" id="logoutBtn">Tancar Sessió</button>
            </div>
        </div>
    </nav>

    <div class="admin-header text-center shadow-sm">
        <h2 class="fw-bold"><i class="bi bi-gear-fill"></i> Panell de Gestió de Reserves</h2>
        <p class="mb-0 text-muted">Aquesta vista és exclusiva per al personal de l'hostal.</p>
    </div>

    <div class="container mb-5">
        <div class="card shadow border-0">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold"><i class="bi bi-list-ul text-danger"></i> Totes les Reserves</h5>
                <button class="btn btn-sm btn-outline-secondary" onclick="cargarTodasLasReservas()"><i class="bi bi-arrow-clockwise"></i> Actualitzar</button>
            </div>
            <div class="card-body">
                <div id="adminReservasContainer">
                    <!-- Aquí se inyectará la tabla de todas las reservas -->
                    <div class="text-center py-5">
                        <div class="spinner-border text-danger" role="status"></div>
                        <p class="mt-2 text-muted">Carregant dades del servidor...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
