<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login | Hostal Montsec</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
        <div class="card p-4 shadow" style="width: 100%; max-width: 400px;">
            <h3 class="text-center mb-4">Iniciar Sessió</h3>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Email</label>

                    <input type="email" id="email" class="form-control" value="testuser@gmail.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contrasenya</label>
                    <input type="password" id="password" class="form-control" value="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
            <div id="loginError" class="alert alert-danger mt-3 d-none">Correu o contrasenya incorrectes.</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
