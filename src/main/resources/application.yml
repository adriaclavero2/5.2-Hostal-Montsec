spring:
  datasource:
    url: jdbc:mysql://localhost:3307/hostal_db?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: montsec_user
    password: montsec_pass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: 8080

logging:
  file:
    name: logs/hostal-montsec.log
  level:
    cat.montsec.hostal: INFO
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"